# FILE LOCATION: frontend/nginx.conf
#
# Serves the built SPA and proxies /api to the backend api service.
# SSE requires disabling proxy buffering, or the alert stream will hang
# until nginx's buffer fills instead of streaming live.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for SSE (/api/v1/alerts/stream) to actually stream live
        # rather than being buffered until the connection closes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
