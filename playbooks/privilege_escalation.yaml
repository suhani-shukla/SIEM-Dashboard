name: privilege_escalation_detection
description: Detects failed permission access followed closely by privilege escalation.
mitre_attack:
  technique_id: T1078
  technique_name: Valid Accounts
  tactic: Privilege Escalation
rule_type: sequence
enabled: true
steps:
  - event_type: login_success
  - event_type: permission_denied
  - event_type: privilege_change
    raw_payload.new_privilege: admin
threshold:
  window_seconds: 300
  group_by: raw_payload.user
severity: critical